<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        :root {
            --azul-fundo: #00061B;
            --calc-corpo: #1a1a1a;
            --tela-fundo: #b5bd99;
            --botao-cor: #333;
            --verde-sucesso: #2ECC71;
            --amarelo-moeda: #EFB608;
            --branco: #FFFFFF;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--azul-fundo);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 15;
        }

        .visual-header {
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        #money-bag-svg {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(239, 182, 8, 0.2));
        }

        .bag-main-path {
            fill: url(#bagGradient);
            stroke: #555;
            stroke-width: 1;
        }

        .bag-rope {
            fill: none;
            stroke: #8b4513;
            stroke-width: 3;
        }

        .bag-top {
            fill: #333;
        }

        .dollar-symbol {
            fill: url(#dollarGradient);
            font-family: Arial Black;
            font-size: 35px;
        }

        .calc-container {
            background-color: var(--calc-corpo);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            width: 300px;
            z-index: 20;
            border: 2px solid #222;
        }

        .screen {
            background-color: var(--tela-fundo);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        #points-view {
            font-size: 1.4rem;
            font-weight: 700;
            color: #222;
            margin: 0;
            min-height: 1.6rem;
        }

        #value-view {
            font-size: 2.2rem;
            font-weight: 900;
            color: #000;
            margin: 8px 0 0 0;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .key {
            background: var(--botao-cor);
            color: var(--branco);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #000;
        }

        .key:active {
            transform: translateY(2px);
            box-shadow: 0 2px #000;
        }

        .key-action {
            grid-column: span 2;
            background-color: var(--verde-sucesso);
            color: #000;
        }

        .key-clear {
            grid-column: span 2;
            background-color: #ED2540;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="visual-header" id="bag-area">
        <svg id="money-bag-svg" viewBox="0 0 160 160">
            <defs>
                <linearGradient id="bagGradient" x1="0" x2="0" y1="1" y2="0">
                    <stop id="fill-offset" offset="0%" stop-color="#EFB608" />
                    <stop id="trans-offset" offset="0%" stop-color="#222" />
                </linearGradient>
                <linearGradient id="dollarGradient" x1="0" x2="0" y1="1" y2="0">
                    <stop id="d-fill" offset="0%" stop-color="#2ECC71" />
                    <stop id="d-empty" offset="0%" stop-color="#555" />
                </linearGradient>
            </defs>
            <path class="bag-top" d="M55,38 Q60,20 70,28 Q80,15 90,28 Q100,20 105,38 L95,45 Q80,40 65,45 Z" />
            <path class="bag-main-path"
                d="M65,45 Q25,50 22,90 Q20,135 30,145 L35,148 Q80,140 125,148 L130,145 Q140,135 138,90 Q135,50 95,45 Q80,48 65,45 Z" />
            <path class="bag-rope" d="M62,44 Q80,40 98,44" />
            <circle cx="80" cy="42" r="3" fill="#5d2e0a" />
            <text x="80" y="105" text-anchor="middle" class="dollar-symbol">$</text>
        </svg>
    </div>

    <div class="calc-container" id="calc-body">
        <div class="screen" id="calc-screen">
            <p id="points-view">0</p>
            <div id="value-view">R$ 0,00</div>
        </div>
        <div class="keypad">
            <button class="key" onclick="press(7)">7</button>
            <button class="key" onclick="press(8)">8</button>
            <button class="key" onclick="press(9)">9</button>
            <button class="key" style="visibility: hidden"></button>
            <button class="key" onclick="press(4)">4</button>
            <button class="key" onclick="press(5)">5</button>
            <button class="key" onclick="press(6)">6</button>
            <button class="key" style="visibility: hidden"></button>
            <button class="key" onclick="press(1)">1</button>
            <button class="key" onclick="press(2)">2</button>
            <button class="key" onclick="press(3)">3</button>
            <button class="key" style="visibility: hidden"></button>
            <button class="key" onclick="press(0)">0</button>
            <button class="key key-clear" onclick="clearAll()">C</button>
            <button class="key" style="visibility: hidden"></button>
            <button class="key key-action" onclick="runCalc()">Calcular</button>
        </div>
    </div>

    <script>
        let inputStr = "";
        let isResultDisplayed = false;
        const pointsDisp = document.getElementById('points-view');
        const valueDisp = document.getElementById('value-view');
        const offsets = [
            document.getElementById('fill-offset'), document.getElementById('trans-offset'),
            document.getElementById('d-fill'), document.getElementById('d-empty')
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let anim = { start: null, target: 0, fill: 0, dur: 2000 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        function press(n) {
            if (isResultDisplayed) {
                clearAll();
                isResultDisplayed = false;
            }
            if (inputStr.length < 7) {
                inputStr += n;
                pointsDisp.innerText = inputStr;
            }
        }

        function clearAll() {
            inputStr = "";
            isResultDisplayed = false;
            pointsDisp.innerText = "0";
            valueDisp.innerText = "R$ 0,00";
            anim.start = null;
            offsets.forEach(el => el.setAttribute('offset', "0%"));
            particles = [];
        }

        function runCalc() {
            const p = parseInt(inputStr) || 0;
            if (p <= 0) return;
            isResultDisplayed = true;

            let factor = 0, maxFill = 0;
            if (p > 100 && p <= 499) { factor = 0.4; maxFill = 35; }
            else if (p >= 500 && p <= 999) { factor = 0.6; maxFill = 65; }
            else if (p >= 1000) { factor = 1.2; maxFill = 100; }

            anim.target = p * factor;
            anim.fill = maxFill;
            anim.start = performance.now();

            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    if (anim.start) particles.push(createCoin());
                }, i * 30);
            }
        }

        function createCoin() {
            const screenRect = document.getElementById('calc-screen').getBoundingClientRect();
            const bagRect = document.getElementById('money-bag-svg').getBoundingClientRect();

            return {
                x: screenRect.left + (screenRect.width / 2),
                y: screenRect.top + (screenRect.height / 2),
                tx: bagRect.left + (bagRect.width / 2) + (Math.random() - 0.5) * 60,
                ty: bagRect.top + (bagRect.height * 0.7),
                sy: -15,
                g: 0.45,
                size: 6,
                done: false
            };
        }

        function update(t) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (anim.start) {
                const prog = Math.min((t - anim.start) / anim.dur, 1);
                const curVal = prog * anim.target;
                const curFill = prog * anim.fill;
                valueDisp.innerText = curVal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                offsets.forEach(el => el.setAttribute('offset', curFill + "%"));
                if (prog === 1) anim.start = null;
            }

            particles.forEach(p => {
                p.sy += p.g; p.x += (p.tx - p.x) * 0.05; p.y += p.sy;
                if (p.y > p.ty && p.sy > 0) p.done = true;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7);
                ctx.fillStyle = '#EFB608'; ctx.fill();
                ctx.strokeStyle = '#B8860B'; ctx.stroke();
            });
            particles = particles.filter(p => !p.done);
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    </script>
</body>

</html>
